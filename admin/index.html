<!doctype html>
<html lang="zh-CN" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#11120E">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>访客分析 · Longbo Xian</title>
<style>
:root{--canvas:#11120E;--surface:#20221B;--elevated:#2E3027;--ink:#F6F0E0;--muted:#C2BEAC;--accent:#E2C68A;--fill:#7A5720;--border:#4A4A38;--bar:#B8964F;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;color-scheme:dark}
@media (prefers-color-scheme: light){:root:not([data-theme="night"]){--canvas:#F4ECDC;--surface:#FFFDF7;--elevated:#E9DDC2;--ink:#231E15;--muted:#5A5242;--accent:#6B4914;--fill:#6E4C18;--border:#C9B894;--bar:#9A7434;color-scheme:light}}
:root[data-theme="champagne"]{--canvas:#F4ECDC;--surface:#FFFDF7;--elevated:#E9DDC2;--ink:#231E15;--muted:#5A5242;--accent:#6B4914;--fill:#6E4C18;--border:#C9B894;--bar:#9A7434;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--canvas);color:var(--ink);font:400 15px/1.5 var(--font);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px 60px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:22px 0 18px;border-bottom:.5px solid var(--border)}
h1{font-size:22px;font-weight:600;margin:0;letter-spacing:-.3px}
h1 span{color:var(--muted);font-weight:400}
.right{margin-left:auto;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:flex;padding:3px;border-radius:999px;background:var(--elevated)}
.seg button{font:500 13px/1 var(--font);color:var(--muted);background:none;border:0;border-radius:999px;padding:8px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:inset 0 0 0 .5px var(--border)}
.btn{font:500 13px var(--font);color:var(--ink);background:var(--elevated);border:0;border-radius:999px;padding:8px 12px;cursor:pointer}
.note{color:var(--muted);font-size:13px;margin:14px 0 0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;margin-top:22px;border:.5px solid var(--border);border-radius:18px;background:var(--surface);overflow:hidden}
.kpi{padding:16px 18px;border-right:.5px solid var(--border)}
.kpi:last-child{border-right:0}
.kpi .l{font-size:12px;color:var(--muted);font-weight:500}
.kpi .v{font-size:28px;font-weight:300;letter-spacing:-.5px;margin-top:2px}
.kpi .d{font-size:12px;color:var(--muted)}
.d.up{color:#7FB07A}.d.down{color:#D08770}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;margin-top:16px}
.card{background:var(--surface);border:.5px solid var(--border);border-radius:18px;padding:16px 18px;min-width:0}
.card.wide{grid-column:1/-1}
.card h2{font-size:14px;font-weight:600;margin:0 0 2px}
.card .sub{font-size:12px;color:var(--muted);margin:0 0 12px}
.rows{display:grid;gap:6px}
.r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;position:relative;padding:5px 8px;border-radius:8px;font-size:13px}
.r .b{position:absolute;inset:0 auto 0 0;background:var(--elevated);border-radius:8px;z-index:0}
.r span{position:relative;z-index:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r .n{color:var(--muted)}
.empty{color:var(--muted);font-size:13px;padding:6px 0}
.chart{display:flex;align-items:flex-end;gap:3px;height:160px;border-bottom:.5px solid var(--border);padding-top:8px}
.chart .c{flex:1;min-width:2px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;position:relative}
.chart .c i{display:block;width:100%;background:var(--bar);border-radius:3px 3px 0 0;min-height:1px}
.chart .c i.u{position:absolute;bottom:0;width:40%;background:var(--accent);opacity:.9}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-bottom:6px}
.legend b{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:5px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:8px 8px;border-bottom:.5px solid var(--border);white-space:nowrap}
td{padding:9px 8px;border-bottom:.5px solid var(--border);vertical-align:top}
tr.v{cursor:pointer}
tr.v:hover td{background:var(--elevated)}
.tl{margin:4px 0 6px;padding:10px 12px;background:var(--canvas);border-radius:12px;font-size:12.5px}
.tl div{padding:2px 0}
.tl .t{color:var(--muted);display:inline-block;min-width:54px;margin-right:8px}
code{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted)}
.tl div{word-break:break-word}
.scroll{overflow-x:auto}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:6px;background:var(--elevated);color:var(--muted);margin:1px 2px 1px 0}
.err{margin-top:24px;padding:16px 18px;border:.5px solid var(--border);border-radius:14px;background:var(--surface)}
@media(max-width:640px){.grid{grid-template-columns:1fr}.kpi .v{font-size:23px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>访客分析 <span>· longbo.cloud</span></h1>
    <div class="right">
      <div class="seg" id="range" role="group" aria-label="时间范围">
        <button type="button" data-days="1" aria-pressed="false">24 小时</button>
        <button type="button" data-days="7" aria-pressed="true">7 天</button>
        <button type="button" data-days="30" aria-pressed="false">30 天</button>
        <button type="button" data-days="90" aria-pressed="false">90 天</button>
      </div>
      <button class="btn" type="button" id="refresh">刷新</button>
      <button class="btn" type="button" id="notrack">不统计本设备</button>
    </div>
  </header>
  <p class="note" id="status">加载中…</p>
  <div id="app"></div>
</div>
<script src="/admin/app.js" defer></script>
</body>
</html>
